<!DOCTYPE html>
<!--
  Source for assets/og-image.jpg (1200×630 link-preview card for LinkedIn, X, Slack…).
  Not published: Jekyll skips folders that start with "_".
  Regenerate (from the repo root, with `python3 -m http.server 8080` running):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --window-size=1200,630 --screenshot=/tmp/og.png http://localhost:8080/_design/og-image.html
    sips -s format jpeg -s formatOptions 90 /tmp/og.png --out assets/og-image.jpg
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG image — Saeed Saedi</title>
<style>
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 100 900;
    src: url('../assets/fonts/inter-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono'; font-style: normal; font-weight: 100 800;
    src: url('../assets/fonts/jetbrains-mono-latin.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #09090b;
    color: #fafafa;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Same grid + duotone glows as the site hero */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(99, 102, 241, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99, 102, 241, 0.07) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(ellipse 75% 85% at 35% 45%, #000 35%, transparent 100%);
            mask-image: radial-gradient(ellipse 75% 85% at 35% 45%, #000 35%, transparent 100%);
  }
  .glow { position: absolute; border-radius: 50%; pointer-events: none; }
  .glow--indigo { width: 760px; height: 760px; top: -300px; right: -220px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.20) 0%, transparent 65%); }
  .glow--cyan { width: 620px; height: 620px; bottom: -330px; left: -200px;
    background: radial-gradient(circle, rgba(34, 211, 238, 0.12) 0%, transparent 70%); }
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, #6366f1, #818cf8, #22d3ee); }

  .content {
    position: absolute; left: 80px; top: 0; bottom: 0; width: 690px;
    display: flex; flex-direction: column; justify-content: center;
  }
  h1 {
    font-size: 92px; font-weight: 800; letter-spacing: -0.035em; line-height: 1;
    margin-bottom: 18px;
  }
  .title {
    font-size: 46px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1;
    background: linear-gradient(100deg, #ffffff 0%, #818cf8 45%, #22d3ee 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 30px;
  }
  .tagline { font-size: 27px; font-weight: 400; line-height: 1.45; color: #d4d4d8; max-width: 600px; }

  .handle {
    position: absolute; left: 80px; bottom: 56px;
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 22px; font-weight: 500;
    color: #a1a1aa;
  }
  .handle span { color: #818cf8; }

  .photo {
    position: absolute; right: 80px; top: 50%; transform: translateY(-50%);
    width: 300px; height: 300px; border-radius: 40px; object-fit: cover;
    border: 1px solid #27272a;
    box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.18), 0 30px 80px rgba(0, 0, 0, 0.55);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow glow--indigo"></div>
  <div class="glow glow--cyan"></div>
  <div class="bar"></div>

  <div class="content">
    <h1>Saeed Saedi</h1>
    <div class="title">Technical Product Manager</div>
    <p class="tagline">Engineering background. Product mindset. Shipping&nbsp;at&nbsp;scale.</p>
  </div>
  <div class="handle"><span>~/</span>saeedsaedi.github.io</div>

  <img class="photo" src="../assets/saeed-saedi.webp" alt="" />
</body>
</html>
