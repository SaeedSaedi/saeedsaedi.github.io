<!DOCTYPE html>
<!--
  Source for assets/og-image.jpg (1200×630 link-preview card for LinkedIn, X, Slack…).
  Not published: Jekyll skips folders that start with "_".
  Regenerate (from the repo root, with `python3 -m http.server 8080` running):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --window-size=1200,630 --screenshot=/tmp/og.png http://localhost:8080/_design/og-image.html
    sips -s format jpeg -s formatOptions 90 /tmp/og.png --out assets/og-image.jpg
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG image — Saeed Saedi</title>
<style>
  @font-face {
    font-family: 'Inter'; font-style: normal; font-weight: 100 900;
    src: url('../assets/fonts/inter-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono'; font-style: normal; font-weight: 100 800;
    src: url('../assets/fonts/jetbrains-mono-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Instrument Serif'; font-style: normal; font-weight: 400;
    src: url('../assets/fonts/instrument-serif-regular.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #09090b;
    color: #fafafa;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .glow { position: absolute; border-radius: 50%; pointer-events: none; }
  .glow--indigo { width: 820px; height: 820px; top: -360px; right: -260px;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.20) 0%, transparent 65%); }
  .glow--cyan { width: 640px; height: 640px; bottom: -360px; left: -220px;
    background: radial-gradient(circle, rgba(34, 211, 238, 0.10) 0%, transparent 70%); }
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, #6366f1, #818cf8, #22d3ee); }

  .content {
    position: absolute; left: 84px; top: 0; bottom: 0; width: 760px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .eyebrow {
    font: 500 17px/1.4 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.08em;
    text-transform: uppercase; color: #67e8f9; margin-bottom: 26px;
  }
  h1 {
    font: 400 132px/0.95 'Instrument Serif', Georgia, serif; letter-spacing: -0.02em;
    margin-bottom: 26px;
  }
  .title {
    font-size: 42px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15;
    background: linear-gradient(100deg, #ffffff 0%, #c7d2fe 40%, #22d3ee 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .url {
    position: absolute; left: 84px; bottom: 54px;
    font: 500 21px/1 'JetBrains Mono', ui-monospace, monospace; color: #a1a1aa;
  }

  /* The SS monogram stands in for a photo (same mark as the favicon) */
  .mark {
    position: absolute; right: 96px; top: 50%; transform: translateY(-50%);
    width: 230px; height: 230px; border-radius: 52px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #4f46e5 0%, #6366f1 45%, #0891b2 100%);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 40px 90px -30px rgba(79, 70, 229, 0.7);
  }
  .mark span { font: 800 120px/1 'Inter', sans-serif; letter-spacing: -0.065em; color: #fff; transform: translate(-3px, -4px); }
</style>
</head>
<body>
  <div class="glow glow--indigo"></div>
  <div class="glow glow--cyan"></div>
  <div class="bar"></div>

  <div class="content">
    <p class="eyebrow">Engineering background · Product mindset · Shipping at scale</p>
    <h1>Saeed Saedi</h1>
    <div class="title">Technical Product Manager</div>
  </div>
  <div class="url">saeedsaedi.github.io</div>

  <div class="mark"><span>SS</span></div>
</body>
</html>
